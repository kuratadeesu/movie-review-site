<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お問い合わせ | 50文字映画レビュー</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">50文字映画レビュー</a>

    <nav class="nav">
      <a href="movies.html">映画を探す</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>


<main>

  <section class="page-header">
    <div class="container">
      <p class="section-label">CONTACT</p>
      <h1>お問い合わせ</h1>
    </div>
  </section>


  <section class="content-section">
    <div class="container content">

      <p>
        サイトに関するご意見・ご質問・掲載内容の修正依頼などはこちらからお問い合わせください。
      </p>

      <form class="contact-form">

        <label for="name">お名前</label>
        <input type="text" id="name" placeholder="お名前">

        <label for="email">メールアドレス</label>
        <input type="email" id="email" placeholder="example@example.com">

        <label for="message">お問い合わせ内容</label>
        <textarea id="message" rows="7" placeholder="お問い合わせ内容"></textarea>

        <button type="submit" class="btn btn-primary">
          送信する
        </button>

      </form>

      <p class="form-note">
        ※現在はデモ版のため、フォーム送信機能は実装されていません。
      </p>

    </div>
  </section>

</main>


<footer class="site-footer">
  <div class="container copyright">
    © 2026 50文字映画レビュー
  </div>
</footer>

</body>
</html>
